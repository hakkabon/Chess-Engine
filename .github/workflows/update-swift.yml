name: Update Swift bindings

# Regenerate the Swift FFI bindings (and XCFramework) from the Rust engine and
# push them to the separate Swift-Chess repository whenever the engine changes.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: macos-latest
    steps:
      - name: Checkout engine
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # Build the cdylib + `uniffi-bindgen`, then generate from that exact dylib.
      # Invoking the CLI explicitly avoids relying on build.rs timestamps.
      - name: Build FFI and generate Swift bindings
        run: |
          set -euxo pipefail
          cargo build -p engine-ffi --release --features cli
          rm -rf engine-ffi/generated/swift
          target/release/uniffi-bindgen generate \
            target/release/libengine_ffi.dylib \
            --language swift \
            --out-dir engine-ffi/generated/swift

      # Build the static libraries for macOS (universal) and iOS (device + simulator).
      - name: Build static libraries
        run: |
          cargo build -p engine-ffi --release --target x86_64-apple-darwin
          cargo build -p engine-ffi --release --target aarch64-apple-darwin
          cargo build -p engine-ffi --release --target aarch64-apple-ios
          cargo build -p engine-ffi --release --target aarch64-apple-ios-sim

      # An XCFramework may contain only one library for a given platform and
      # variant. Both inputs are macOS libraries, so merge them into one
      # universal archive before creating the XCFramework.
      - name: Assemble XCFramework
        run: |
          set -euxo pipefail
          test -f target/x86_64-apple-darwin/release/libengine_ffi.a
          test -f target/aarch64-apple-darwin/release/libengine_ffi.a
          test -f engine-ffi/generated/swift/ChessEngineKit.swift
          test -f engine-ffi/generated/swift/ChessEngineKitFFI.h
          test -f engine-ffi/generated/swift/ChessEngineKitFFI.modulemap

          mkdir -p engine-ffi/generated/headers
          cp engine-ffi/generated/swift/ChessEngineKitFFI.h engine-ffi/generated/headers/
          cp engine-ffi/generated/swift/ChessEngineKitFFI.modulemap engine-ffi/generated/headers/module.modulemap

          rm -rf build/ChessEngineKitFFI.xcframework
          mkdir -p build
          lipo -create \
            target/x86_64-apple-darwin/release/libengine_ffi.a \
            target/aarch64-apple-darwin/release/libengine_ffi.a \
            -output build/libmac.a
          lipo -info build/libmac.a
          cp target/aarch64-apple-ios/release/libengine_ffi.a build/libios.a
          cp target/aarch64-apple-ios-sim/release/libengine_ffi.a build/libsim.a

          xcodebuild -create-xcframework \
            -library build/libmac.a \
            -headers engine-ffi/generated/headers \
            -library build/libios.a \
            -headers engine-ffi/generated/headers \
            -library build/libsim.a \
            -headers engine-ffi/generated/headers \
            -output build/ChessEngineKitFFI.xcframework

      # Mirror the generated artifacts into the Swift-Chess repository.
      - name: Push to Swift-Chess
        env:
          PAT: ${{ secrets.SWIFT_REPO_PAT }}
        run: |
          set -euo pipefail
          if [[ -z "${PAT}" ]]; then
            echo "::error::SWIFT_REPO_PAT is not configured in the Chess-Engine repository"
            exit 1
          fi

          git clone "https://x-access-token:${PAT}@github.com/hakkabon/Swift-Chess.git" swift-out
          cd swift-out
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Generated UniFFI bindings -> Sources/ChessEngineKit/ (matches the
          # `import ChessEngineKit` used by the Swift UI). Remove any stale copy
          # that may have been left in the frontend directory.
          mkdir -p Sources/ChessEngineKit Sources/SwiftChess Sources/ChessUIKit Frameworks
          rm -rf FFIHeaders
          rm -f Sources/SwiftChess/ChessEngineKit.swift \
                Sources/SwiftChess/ChessEngineKitFFI.h \
                Sources/SwiftChess/ChessEngineKitFFI.modulemap
          cp ../engine-ffi/generated/swift/ChessEngineKit.swift Sources/ChessEngineKit/

          # ChessViewModel currently imports SwiftChess. Keep that compatibility
          # module non-empty and re-export the generated engine API from it.
          cat > Sources/SwiftChess/SwiftChess.swift <<'SWIFT'
          @_exported import ChessEngineKit
          SWIFT

          # XCFramework -> Frameworks/ChessEngineKitFFI.xcframework
          rm -rf Frameworks/ChessEngineKitFFI.xcframework
          cp -R ../build/ChessEngineKitFFI.xcframework Frameworks/

          # Point the binary target at the locally-committed framework (the old
          # remote release URL/checksum is no longer used). The UI lives in the
          # `ChessUIKit` library (shared by the macOS app and the iOS/iPadOS app),
          # and the package now ships an iOS slice in the XCFramework.
          cat > Package.swift <<'SWIFT'
          // swift-tools-version:6.0
          import PackageDescription

          let package = Package(
              name: "SwiftChess",
              platforms: [.macOS(.v13), .iOS(.v14)],
              products: [
                  .library(name: "SwiftChess", targets: ["SwiftChess"]),
                  .library(name: "ChessUIKit", targets: ["ChessUIKit"]),
                  .executable(name: "ChessUI", targets: ["ChessUI"]),
              ],
              targets: [
                  .target(
                      name: "ChessEngineKit",
                      dependencies: ["EngineFFI"]
                  ),
                  .target(
                      name: "SwiftChess",
                      dependencies: ["ChessEngineKit"]
                  ),
                  .binaryTarget(
                      name: "EngineFFI",
                      path: "Frameworks/ChessEngineKitFFI.xcframework"
                  ),
                  .target(
                      name: "ChessUIKit",
                      dependencies: ["SwiftChess", "ChessEngineKit"],
                      path: "Sources/ChessUIKit",
                      resources: [.process("Resources")]
                  ),
                  .executableTarget(
                      name: "ChessUI",
                      dependencies: ["ChessUIKit"],
                      path: "Sources/ChessUI"
                  ),
                  .testTarget(
                      name: "SwiftChessTests",
                      dependencies: ["SwiftChess"]
                  ),
              ],
              swiftLanguageModes: [.v5]
          )
          SWIFT

          # Catch malformed manifests, missing modules and linker errors before
          # committing generated artifacts to the frontend repository.
          swift build

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to push"
          else
            git commit -m "Update ChessEngineKit bindings (auto-generated from Chess-Engine)"
            git push
          fi
